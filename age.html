<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator — Exact Age in Years Months Days | FreeTools</title>
  <meta name="description" content="Free age calculator. Find your exact age in years, months and days from date of birth. Arabic & English.">
  <link rel="canonical" href="https://mazooniosman299-blip.github.io/freetools/age.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">FreeTools</a>
      <div class="header-actions">
        <button id="lang-toggle" class="btn-icon">العربية</button>
        <button id="theme-toggle" class="btn-icon">🌙</button>
      </div>
    </div>
  </header>
  <main class="tool-page container">
    <a href="index.html" class="back-link">← Back</a>
    <h1>Age Calculator</h1>
    <p class="tool-desc">Calculate exact age from birth date to today (or any date).</p>
    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <label>Date of birth</label>
          <input type="date" id="dob">
        </div>
        <div class="form-group">
          <label>As of (optional)</label>
          <input type="date" id="asof">
        </div>
      </div>
      <button class="btn" id="calc">Calculate Age</button>
      <div class="result-box" id="result" style="display:none">
        <div class="value" id="res-val">—</div>
        <div class="label" id="res-label"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="container footer-inner"><p>© 2026 FreeTools</p></div></footer>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById("asof").valueAsDate = new Date();
    function parseDay(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return null;
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;
      return date;
    }
    function anniversary(start, offset) {
      const y = start.getUTCFullYear(), m = start.getUTCMonth() + offset;
      const daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      return new Date(Date.UTC(y, m, Math.min(start.getUTCDate(), daysInMonth)));
    }
    function calc() {
      const birth = parseDay(document.getElementById("dob").value);
      const asof = parseDay(document.getElementById("asof").value);
      const box = document.getElementById("result");
      if (!birth || !asof || asof < birth) {
        box.style.display = "block";
        document.getElementById("res-val").textContent = "—";
        document.getElementById("res-label").textContent = "Enter valid dates; the reference date must not be before birth.";
        return;
      }
      let totalMonths = (asof.getUTCFullYear() - birth.getUTCFullYear()) * 12 + asof.getUTCMonth() - birth.getUTCMonth();
      while (totalMonths > 0 && anniversary(birth, totalMonths) > asof) totalMonths--;
      const base = anniversary(birth, totalMonths);
      const years = Math.floor(totalMonths / 12), months = totalMonths % 12;
      const days = Math.round((asof - base) / 86400000);
      box.style.display = "block";
      document.getElementById("res-val").textContent = years + " y " + months + " m " + days + " d";
      document.getElementById("res-label").textContent = "Years: " + years + ", Months: " + months + ", Days: " + days;
    }
    document.getElementById("calc").addEventListener("click", calc);
    document.getElementById("dob").addEventListener("change", calc);
    document.getElementById("asof").addEventListener("change", calc);
  </script>
</body>
</html>
